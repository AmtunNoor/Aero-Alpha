<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Arabic Alpha Flight Adventure</title>

    <link rel="manifest" href="manifest.json">

    <style>
        /* Embed Premium Childhood Arcade Typography */
        @font-face {
            font-family: 'BalooBhaijaan';
            src: url('assets/font/BalooBhaijaan2-ExtraBold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1527; /* Deep midnight aviation background */
            font-family: 'BalooBhaijaan', Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Fullscreen Hardware Canvas Presentation Mode */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script src="game.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .catch(err => console.log("Service Worker registration deferred: ", err));
            });
        }
    </script>

</body>
</html>
